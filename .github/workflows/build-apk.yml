name: Build Android APK (World of Work)

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./android/gradlew

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK file
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./WorldOfWork.apk

      - name: Upload APK as Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldOfWork-APK
          path: ./WorldOfWork.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0
          name: "World of Work - Aplicación Móvil Android (APK)"
          body: |
            ### 🚜 World of Work - Aplicación Móvil Instalable
            Descargá el archivo **`WorldOfWork.apk`** directamente en tu celular Android e instalalo.
          files: ./WorldOfWork.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
